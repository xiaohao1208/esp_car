; ESP32 小车 PlatformIO 编译和依赖配置
[env:esp32_car]
; 使用 PlatformIO 官方 Espressif32 平台
platform = espressif32@6.13.0
; 目标板采用通用 ESP32 DevKit 引脚和烧录参数
board = esp32dev
; 固件使用 Arduino 框架
framework = arduino
; micro-ROS 使用 WiFi UDP 连接 Jetson Agent
board_microros_transport = wifi

; 由当前 CarMcuStatus 接口交叉编译得到的 Xtensa 静态库
build_flags =
    -L${PROJECT_DIR}/lib
    -lcar_interfaces__rosidl_generator_c
    -lcar_interfaces__rosidl_typesupport_c
    -lcar_interfaces__rosidl_typesupport_introspection_c
    -lcar_interfaces__rosidl_typesupport_microxrcedds_c

lib_deps =
    https://github.com/fishros/MPU6050_light.git#d3e10a2545b03cfb874a9faaf4fc125d02d98421        ; MPU6050 IMU 驱动
    https://github.com/fishros/Esp32McpwmMotor.git#145c06da90599769419abd46d858f17b4f018929        ; MCPWM 电机驱动
    https://github.com/fishros/Esp32PcntEncoder.git#7cce8d01fa2d343878f3e70c71d95cb51a387316      ; PCNT 编码器驱动
    https://github.com/fishros/micro_ros_platformio.git#a2f9de79f90af96ee63175a28d441da3eeac40e4     ; micro-ROS PlatformIO 支持
    olikraus/U8g2@2.36.18                                                                                ; 0.96寸 I2C OLED 显示驱动
